<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A1D21" />
  <link rel="manifest" href="manifest.json" />
  <title>Mantenimiento BolsaPlast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1A1D21; --bg-panel: #22262C; --bg-card: #2A2F38; --bg-card-hover: #323843;
      --border: #353B45; --border-light: #454D5A;
      --text: #E8E8E8; --text-muted: #8A95A3; --text-dim: #5A6472;
      --alta: #E84040; --alta-border: rgba(232,64,64,0.35);
      --media: #F59E0B; --media-border: rgba(245,158,11,0.35);
      --baja: #4A9ECC; --baja-border: rgba(74,158,204,0.35);
      --verde: #34D399; --verde-border: rgba(52,211,153,0.35);
      --carlos: #A78BFA; --alberto: #34D399;
      --radius: 8px; --radius-sm: 5px;
    }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; }

    /* HEADER */
    header { background:var(--bg-panel); border-bottom:1px solid var(--border); padding:0 16px; display:flex; align-items:center; justify-content:space-between; height:56px; position:sticky; top:0; z-index:100; }
    .header-left { display:flex; align-items:center; gap:12px; }
    .logo-mark { width:32px; height:32px; background:var(--alta); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; flex-shrink:0; }
    .header-title { font-weight:600; font-size:15px; }
    .header-sub { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
    .header-right { display:flex; align-items:center; gap:8px; }
    #clock { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); text-align:right; line-height:1.4; }
    .user-selector { display:flex; gap:6px; }
    .user-btn { padding:5px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-size:12px; font-weight:500; transition:all 0.15s; font-family:'Inter',sans-serif; }
    .user-btn.active-carlos { background:rgba(167,139,250,0.15); border-color:var(--carlos); color:var(--carlos); }
    .user-btn.active-alberto { background:rgba(52,211,153,0.15); border-color:var(--alberto); color:var(--alberto); }

    /* TABS */
    .tabs { background:var(--bg-panel); border-bottom:1px solid var(--border); display:flex; gap:0; padding:0 16px; }
    .tab { padding:12px 18px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; white-space:nowrap; }
    .tab.active { color:var(--text); border-bottom-color:var(--alta); }
    .tab:hover:not(.active) { color:var(--text); }

    /* MAIN */
    main { padding:16px; max-width:1400px; margin:0 auto; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* ADD FORM */
    .add-form { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:20px; }
    .add-form-title { font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
    .form-row { display:flex; gap:8px; flex-wrap:wrap; }
    .form-row textarea { flex:1; min-width:200px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 10px; font-family:'Inter',sans-serif; font-size:14px; resize:vertical; min-height:38px; max-height:120px; outline:none; transition:border-color 0.15s; }
    .form-row textarea:focus { border-color:var(--border-light); }
    .form-row textarea::placeholder { color:var(--text-dim); }
    .priority-select { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 10px; font-family:'Inter',sans-serif; font-size:13px; outline:none; cursor:pointer; min-width:130px; }
    .btn-add { background:var(--alta); border:none; border-radius:var(--radius-sm); color:#fff; padding:8px 16px; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; transition:opacity 0.15s; font-family:'Inter',sans-serif; }
    .btn-add:hover { opacity:0.85; }
    .btn-add:disabled { opacity:0.4; cursor:not-allowed; }

    /* BOARD */
    .board { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .column { background:var(--bg-panel); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; }
    .column-header { padding:12px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
    .column-alta .column-header { border-top:3px solid var(--alta); }
    .column-media .column-header { border-top:3px solid var(--media); }
    .column-baja .column-header { border-top:3px solid var(--baja); }
    .column-label { font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.8px; display:flex; align-items:center; gap:7px; }
    .column-alta .column-label { color:var(--alta); }
    .column-media .column-label { color:var(--media); }
    .column-baja .column-label { color:var(--baja); }
    .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot-alta { background:var(--alta); } .dot-media { background:var(--media); } .dot-baja { background:var(--baja); }
    .count-badge { font-size:11px; font-weight:600; background:var(--bg-card); color:var(--text-muted); border-radius:20px; padding:1px 7px; font-family:'JetBrains Mono',monospace; }
    .cards-container { padding:10px; display:flex; flex-direction:column; gap:8px; min-height:80px; }

    /* CARDS */
    .card { background:var(--bg-card); border-radius:var(--radius-sm); padding:10px 12px; position:relative; transition:background 0.15s; }
    .card:hover { background:var(--bg-card-hover); }
    .column-alta .card { border-left:3px solid var(--alta-border); }
    .column-media .card { border-left:3px solid var(--media-border); }
    .column-baja .card { border-left:3px solid var(--baja-border); }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .card-text { font-size:13.5px; color:var(--text); line-height:1.45; flex:1; }
    .card-actions { display:flex; gap:4px; flex-shrink:0; opacity:0; transition:opacity 0.15s; }
    .card:hover .card-actions { opacity:1; }
    .card-btn { width:36px; height:36px; border-radius:6px; border:1px solid var(--border); background:var(--bg-panel); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:19px; transition:all 0.15s; }
    .card-btn:hover { border-color:var(--border-light); color:var(--text); }
    .card-btn.delete:hover { border-color:var(--alta); color:var(--alta); }
    .card-btn.complete:hover { border-color:var(--verde); color:var(--verde); }
    .card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .card-author { font-size:11px; font-weight:600; font-family:'JetBrains Mono',monospace; padding:1px 6px; border-radius:3px; }
    .author-carlos { color:var(--carlos); background:rgba(167,139,250,0.12); }
    .author-alberto { color:var(--alberto); background:rgba(52,211,153,0.12); }
    .card-date { font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }

    /* EDIT */
    .edit-textarea { width:100%; background:var(--bg-panel); border:1px solid var(--border-light); border-radius:var(--radius-sm); color:var(--text); padding:6px 8px; font-family:'Inter',sans-serif; font-size:13.5px; resize:vertical; min-height:60px; outline:none; margin-bottom:6px; }
    .edit-actions { display:flex; gap:6px; margin-bottom:6px; }
    .btn-save { background:var(--baja); border:none; border-radius:4px; color:#fff; padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-cancel { background:transparent; border:1px solid var(--border); border-radius:4px; color:var(--text-muted); padding:4px 10px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif; }

    /* COMPRAS */
    .compras-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:10px; align-items:start; }
    .compra-card { background:var(--bg-card); border-left:3px solid var(--verde-border); border-radius:var(--radius-sm); padding:10px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; transition:background 0.15s; }
    .compra-card:hover { background:var(--bg-card-hover); }
    .compra-check { width:18px; height:18px; border-radius:4px; border:1px solid var(--border-light); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
    .compra-check.checked { background:var(--verde); border-color:var(--verde); }
    .compra-texto { flex:1; font-size:13.5px; }
    .compra-texto.tachado { text-decoration:line-through; color:var(--text-dim); }
    .compra-actions { display:flex; gap:4px; opacity:0; transition:opacity 0.15s; }
    .compra-card:hover .compra-actions { opacity:1; }

    /* HISTORIAL */
    .historial-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
    .historial-title { font-size:13px; color:var(--text-muted); }
    .export-btns { display:flex; gap:8px; }
    .btn-export { padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-panel); color:var(--text-muted); cursor:pointer; font-size:12px; font-weight:600; font-family:'Inter',sans-serif; transition:all 0.15s; display:flex; align-items:center; gap:5px; }
    .btn-export:hover { border-color:var(--border-light); color:var(--text); }
    .btn-export.excel:hover { border-color:var(--verde); color:var(--verde); }
    .historial-table { width:100%; border-collapse:collapse; }
    .historial-table th { background:var(--bg-panel); padding:10px 12px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); border-bottom:1px solid var(--border); }
    .historial-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
    .historial-table tr:hover td { background:var(--bg-panel); }
    .pill { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; }
    .pill-alta { background:rgba(232,64,64,0.15); color:var(--alta); }
    .pill-media { background:rgba(245,158,11,0.15); color:var(--media); }
    .pill-baja { background:rgba(74,158,204,0.15); color:var(--baja); }

    /* EMPTY */
    .empty-state { text-align:center; padding:24px 12px; color:var(--text-dim); font-size:12px; line-height:1.6; }

    /* LIVE */
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--alberto); display:inline-block; margin-right:4px; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
    .live-label { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; display:flex; align-items:center; }

    /* MODAL USUARIO */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; }
    .modal { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:28px 24px; width:100%; max-width:360px; text-align:center; }
    .modal h2 { font-size:17px; font-weight:700; margin-bottom:8px; }
    .modal p { font-size:13px; color:var(--text-muted); margin-bottom:22px; }
    .user-choice-btns { display:flex; gap:12px; justify-content:center; }
    .btn-user-choice { flex:1; padding:14px 10px; border-radius:var(--radius); border:2px solid var(--border); background:var(--bg-card); color:var(--text); cursor:pointer; font-size:15px; font-weight:700; font-family:'Inter',sans-serif; transition:all 0.15s; }
    .btn-user-choice.carlos:hover { border-color:var(--carlos); color:var(--carlos); background:rgba(167,139,250,0.1); }
    .btn-user-choice.alberto:hover { border-color:var(--alberto); color:var(--alberto); background:rgba(52,211,153,0.1); }

    /* TOAST */
    #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius); padding:10px 18px; font-size:13px; color:var(--text); z-index:300; transition:transform 0.25s ease; white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); }

    /* LISTA ÚNICA DE TAREAS */
    .lista-tareas { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:12px; max-width:1500px; margin:0 auto; align-items:start; }
    .urgente-check { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); white-space:nowrap; cursor:pointer; user-select:none; }
    .urgente-check input { width:16px; height:16px; cursor:pointer; }
    .card.urgente { border-left:4px solid var(--alta) !important; }

    /* AUTOR GENÉRICO (operarios) */
    .author-op { color:var(--text-muted); background:rgba(255,255,255,0.06); }

    /* ESTADO EN CURSO */
    .estado-badge { font-size:13px; font-weight:800; padding:4px 10px; border-radius:5px; margin-left:8px; margin-right:8px; text-transform:uppercase; letter-spacing:.4px; vertical-align:middle; display:inline-block; }
    .estado-badge.en-curso { background:rgba(74,158,204,0.15); color:var(--baja); }
    .estado-badge.urgente { background:var(--alta); color:#fff; }
    .card-btn.iniciar:hover { border-color:var(--baja); color:var(--baja); }

    /* DASHBOARD DE OPERARIOS */
    .operarios-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
    .operario-card { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-card); }
    .operario-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .operario-dot.libre { background:var(--verde); box-shadow:0 0 8px rgba(52,211,153,0.5); }
    .operario-dot.ocupado { background:var(--alta); box-shadow:0 0 8px rgba(232,64,64,0.5); }
    .operario-info { min-width:0; }
    .operario-nombre { font-size:13px; font-weight:600; color:var(--text); }
    .operario-tarea { font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .usuario-select { background:var(--bg-panel); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 8px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
    .usuario-select:focus { outline:none; border-color:var(--alta); }
    .equipo-modal-list { max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin-top:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 0; }

    /* MÁS VISIBILIDAD PARA EN CURSO / TERMINADO */
    .card.en-curso { border-left:3px solid var(--baja) !important; background:linear-gradient(90deg, rgba(74,158,204,0.10), var(--bg-card) 55%); }
    .estado-badge.en-curso { background:var(--baja); color:#04202b; font-weight:700; }
    .hist-card { border-left:3px solid var(--verde-border); }
    .card.pausada { border-left:3px solid var(--media) !important; background:linear-gradient(90deg, rgba(245,158,11,0.10), var(--bg-card) 55%); }
    .estado-badge.pausada { background:var(--media); color:#2b1a02; font-weight:700; }

    /* BANNER DE PREVENTIVO DEL DÍA */
    .prev-banner { max-width:1500px; margin:0 auto 14px; background:rgba(74,158,204,0.10); border:1px solid var(--baja); border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--baja); text-align:center; }

    /* BUSCADOR / FILTROS */
    .filtros-bar { max-width:1500px; margin:0 auto 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .filtros-bar input { flex:1; min-width:200px; background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif; }
    .filtros-bar input:focus { outline:none; border-color:var(--baja); }
    .filtros-modo { display:flex; gap:6px; }
    .filtro-btn { background:var(--bg-panel); border:1px solid var(--border); color:var(--text-muted); padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .filtro-btn.active { background:var(--baja); border-color:var(--baja); color:#04202b; }
    .filtro-btn:hover:not(.active) { border-color:var(--border-light); }

    /* CELEBRACIÓN AL COMPLETAR */
    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity:1; }
      100% { transform: translateY(90vh) rotate(720deg); opacity:0; }
    }
    .confetti-piece { position:fixed; top:0; width:9px; height:9px; border-radius:2px; pointer-events:none; z-index:600; animation-name:confetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards; }
    @keyframes celebracion-pop {
      0% { transform:translate(-50%,-20px) scale(0.9); opacity:0; }
      12% { transform:translate(-50%,0) scale(1.03); opacity:1; }
      20% { transform:translate(-50%,0) scale(1); opacity:1; }
      85% { opacity:1; }
      100% { opacity:0; transform:translate(-50%,-10px) scale(0.98); }
    }
    .celebracion-banner { position:fixed; top:70px; left:50%; z-index:601; background:linear-gradient(135deg, var(--verde-border), #1a8f6a); color:#fff; font-weight:700; font-size:16px; padding:14px 26px; border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,0.4); text-align:center; animation:celebracion-pop 3.2s ease forwards; }

    /* CALENDARIO PREVENTIVO */
    .prev-header { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:16px; }
    .prev-nav { width:36px; height:36px; border-radius:6px; border:1px solid var(--border); background:var(--bg-panel); color:var(--text); font-size:16px; cursor:pointer; }
    .prev-nav:hover { border-color:var(--border-light); }
    .prev-mes-titulo { font-size:18px; font-weight:700; text-transform:capitalize; min-width:200px; text-align:center; }
    .prev-dias-semana { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:1100px; margin:0 auto 6px; text-align:center; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
    .prev-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:1100px; margin:0 auto; }
    .prev-celda { min-height:100px; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:4px; }
    .prev-celda.vacia { background:transparent; border:none; }
    .prev-celda.hoy { border-color:var(--baja); box-shadow:0 0 0 1px var(--baja); }
    .prev-dia-num { font-size:12px; font-weight:700; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center; }
    .prev-add-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:0 2px; }
    .prev-add-btn:hover { color:var(--baja); }
    .prev-maquina-chip { font-size:10.5px; font-weight:600; font-family:'JetBrains Mono',monospace; padding:2px 5px; border-radius:3px; background:rgba(52,211,153,0.12); color:var(--verde); display:flex; justify-content:space-between; align-items:center; gap:4px; }
    .prev-maquina-chip .quitar { cursor:pointer; opacity:.6; }
    .prev-maquina-chip .quitar:hover { opacity:1; }

    /* IMÁGENES */
    .img-gallery { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .img-thumb { width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer; transition:opacity 0.15s; }
    .img-thumb:hover { opacity:0.8; }
    .img-lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; }
    .img-lightbox img { max-width:100%; max-height:100%; border-radius:8px; }

    /* RESPONSABLES */
    .resp-wrap { position:relative; display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .resp-chip { font-size:10.5px; font-weight:600; font-family:'JetBrains Mono',monospace; padding:1px 6px; border-radius:3px; background:rgba(74,158,204,0.12); color:var(--baja); }
    .resp-chip.sin { background:transparent; color:var(--text-dim); font-weight:400; font-family:'Inter',sans-serif; }
    .btn-asignar { width:22px; height:22px; border-radius:4px; border:1px solid var(--border); background:var(--bg-panel); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
    .btn-asignar:hover { border-color:var(--border-light); color:var(--text); }

let usuario = null;

// CLOCK
function tick() {

// TABS
function mostrarTab(tab) {

  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['tareas','compras','historial','operarios','preventivo'][i]===tab));

function renderizarOperarios() {
  const ocupados = {}; // nombre -> texto de la tarea en la que está

}

// USUARIO
function setUsuario(nombre) {
  if (!nombre) return;
  usuario = nombre;
  localStorage.setItem('usuario', nombre);
  ['usuarioActual','usuarioActualCompras'].forEach(id => { const el=document.getElementById(id); if (el) el.value = nombre; });
}
function cambiarUsuario(n) { setUsuario(n); toast('✓ Cambiado a '+n); }

// INIT
async function init() {
  const opcionesHtml = OPERARIOS.map(op => `<option value="${esc(op)}">${esc(op)}</option>`).join('');

  const { data, error } = await sb.from('preventivo').select('*')
    .eq('anio', hoy.getFullYear()).eq('mes', hoy.getMonth() + 1).eq('dia', hoy.getDate());

  banner.style.display = 'block';
}

// ── CELEBRACIÓN AL COMPLETAR ──
const FRASES_COMPLETAR = [
  '¡Bien ahí, {n}! 💪',
  '¡Una menos, {n}! 🔥',
  '¡Grande, {n}! 👏',
  '¡Sos una máquina, {n}! ⚙️',
  '¡Excelente trabajo, {n}!',
  '¡Así se hace, {n}! ✅',
  '¡Vamos {n}, con todo! 🚀',
];

function lanzarConfetti() {
  const colores = ['#34d399', '#4a9ecc', '#f59e0b', '#e84040'];
  for (let i = 0; i < 40; i++) {
    const pieza = document.createElement('div');
    pieza.className = 'confetti-piece';
    pieza.style.left = Math.random() * 100 + 'vw';
    pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
    pieza.style.animationDelay = (Math.random() * 0.3) + 's';
    pieza.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
    document.body.appendChild(pieza);
    setTimeout(() => pieza.remove(), 2000);
  }
}

function mostrarCelebracion(mensaje) {
  const el = document.createElement('div');
  el.className = 'celebracion-banner';
  el.innerHTML = mensaje.replace('\n', '<br><span style="font-size:13px;font-weight:500;opacity:.85">') + (mensaje.includes('\n') ? '</span>' : '');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function sonidoCompletar() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = ctx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.0001, ahora + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.22, ahora + i * 0.09 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ahora + i * 0.09 + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ahora + i * 0.09); osc.stop(ahora + i * 0.09 + 0.4);
    });
  } catch (e) { /* si el navegador bloquea audio sin interacción previa, no pasa nada */ }
}

async function celebrarCompletado(nombre) {
  lanzarConfetti();
  sonidoCompletar();
  const inicioSemana = new Date();
  inicioSemana.setDate(inicioSemana.getDate() - inicioSemana.getDay());
  inicioSemana.setHours(0, 0, 0, 0);
  let mensajeExtra = '';
  try {
    const { count } = await sb.from('historial')
      .select('id', { count: 'exact', head: true })
      .eq('cerrado_por', nombre)
      .gte('closed_at', inicioSemana.toISOString());
    if (count) mensajeExtra = `\nVas ${count} completada${count === 1 ? '' : 's'} esta semana 🎯`;
  } catch (e) { /* si falla la consulta, igual mostramos el festejo */ }
  const frase = FRASES_COMPLETAR[Math.floor(Math.random() * FRASES_COMPLETAR.length)].replace('{n}', nombre);
  mostrarCelebracion(frase + mensajeExtra);
}

// ── PREVENTIVO ──
let prevFecha = new Date(); // mes que se está mostrando
let preventivoData = []; // filas del mes actual

async function cargarPreventivo() {
  const anio = prevFecha.getFullYear();
  const mes = prevFecha.getMonth() + 1;
  const { data, error } = await sb.from('preventivo').select('*').eq('anio', anio).eq('mes', mes);
  if (error) { toast('❌ Error cargando preventivo'); return; }
  preventivoData = data || [];
  renderizarPreventivo();
}

function cambiarMesPreventivo(delta) {
  prevFecha = new Date(prevFecha.getFullYear(), prevFecha.getMonth() + delta, 1);
  cargarPreventivo();
}

async function agregarMaquinaPreventivo(dia) {
  const maquina = prompt('¿Qué máquina va ese día?');
  if (!maquina || !maquina.trim()) return;
  if (!usuario) { toast('Elegí quién sos primero (arriba en Tareas o Compras)'); return; }
  const anio = prevFecha.getFullYear();
  const mes = prevFecha.getMonth() + 1;
  const { data, error } = await sb.from('preventivo')
    .insert({ anio, mes, dia, maquina: maquina.trim(), autor: usuario })
    .select().single();
  if (error) { toast('❌ Error guardando'); return; }
  preventivoData.push(data);
  renderizarPreventivo();
  toast('✓ Agregada');
}

async function quitarMaquinaPreventivo(id) {
  const { error } = await sb.from('preventivo').delete().eq('id', id);
  if (error) { toast('❌ Error eliminando'); return; }
  preventivoData = preventivoData.filter(p => p.id !== id);
  renderizarPreventivo();
}

function renderizarPreventivo() {
  const anio = prevFecha.getFullYear();
  const mes = prevFecha.getMonth(); // 0-indexado
  const nombreMes = prevFecha.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  document.getElementById('prevMesTitulo').textContent = nombreMes;

  const primerDiaSemana = (new Date(anio, mes, 1).getDay() + 6) % 7; // 0=lunes
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  const hoy = new Date();
  const esMesActual = hoy.getFullYear() === anio && hoy.getMonth() === mes;

  const porDia = {};
  preventivoData.forEach(p => { (porDia[p.dia] ||= []).push(p); });

  let celdas = '';
  for (let i = 0; i < primerDiaSemana; i++) celdas += '<div class="prev-celda vacia"></div>';
  for (let dia = 1; dia <= diasEnMes; dia++) {
    const items = porDia[dia] || [];
    const esHoy = esMesActual && hoy.getDate() === dia;
    celdas += `<div class="prev-celda ${esHoy ? 'hoy' : ''}">
      <div class="prev-dia-num">${dia}<button class="prev-add-btn" onclick="agregarMaquinaPreventivo(${dia})" title="Agregar máquina">➕</button></div>
      ${items.map(p => `<div class="prev-maquina-chip"><span>${esc(p.maquina)}</span><span class="quitar" onclick="quitarMaquinaPreventivo('${p.id}')">✕</span></div>`).join('')}
    </div>`;
  }
  document.getElementById('prevGrid').innerHTML = celdas;
}

// ── PAUSAR ──
async function pausarTarea(id) {
  const { error } = await sb.from('notas').update({ estado: 'pausada' }).eq('id', id);
  if (error) { toast('❌ Error'); return; }
  const nota = notas.find(n => n.id === id);
  if (nota) nota.estado = 'pausada';
  renderizarNotas();
  toast('⏸ Pausada');
}

// ── IMÁGENES ──
function renderImagenes(imagenes) {
  if (!imagenes || !imagenes.length) return '';
  return `<div class="img-gallery">${imagenes.map(url =>
    `<img class="img-thumb" src="${esc(url)}" onclick="event.stopPropagation();abrirLightbox('${esc(url)}')">`
  ).join('')}</div>`;
}
function abrirLightbox(url) {
  const box = document.createElement('div');
  box.className = 'img-lightbox';
  box.innerHTML = `<img src="${esc(url)}">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

// ── EQUIPO (responsables / poner en curso, tareas y compras) ──
let equipoModal = null; // { tabla, id, modo: 'asignar'|'iniciar', seleccion }

function abrirEquipoModal(tabla, id, modo) {
  const lista = tabla === 'notas' ? notas : compras;
  const item = lista.find(x => x.id === id);
  if (!item) return;
  equipoModal = { tabla, id, modo, seleccion: [...(item.responsables || [])] };
  renderEquipoModal();
}
function cerrarEquipoModal() {
  equipoModal = null;
  renderEquipoModal();
}
function toggleEquipoSeleccion(nombre) {
  if (!equipoModal) return;
  const s = equipoModal.seleccion;
  equipoModal.seleccion = s.includes(nombre) ? s.filter(n => n !== nombre) : [...s, nombre];
  renderEquipoModal();
}
async function guardarEquipoModal() {
  if (!equipoModal) return;
  const { tabla, id, modo, seleccion } = equipoModal;

  if (modo === 'iniciar' && !seleccion.length) {
    toast('Elegí al menos un operario para poner en curso');
    return;
  }
  if (modo === 'asignar' && tabla === 'notas') {
    const item = notas.find(n => n.id === id);
    if (item?.estado === 'en_curso' && !seleccion.length) {
      toast('No podés dejar una tarea en curso sin operarios — marcala como Terminada en su lugar');
      return;
    }
  }

  const payload = { responsables: seleccion };
  if (modo === 'iniciar') payload.estado = 'en_curso';

  const { error } = await sb.from(tabla).update(payload).eq('id', id);
  if (error) { toast('❌ Error guardando'); return; }

  const lista = tabla === 'notas' ? notas : compras;
  const item = lista.find(x => x.id === id);
  if (item) {
    item.responsables = seleccion;
    if (modo === 'iniciar') item.estado = 'en_curso';
  }
  equipoModal = null;
  renderizarNotas(); renderizarCompras(); renderEquipoModal();
  toast(modo === 'iniciar' ? '▶️ Puesta en curso' : '✓ Equipo actualizado');
}
function renderEquipoModal() {
  const root = document.getElementById('equipoModalRoot');
  if (!equipoModal) { root.innerHTML = ''; return; }
  const { seleccion, modo } = equipoModal;
  root.innerHTML = `
    <div class="modal-overlay" style="display:flex" onclick="if(event.target===this) cerrarEquipoModal()">
      <div class="modal">
        <h2>👷 ${modo === 'iniciar' ? '¿Quién va a trabajar en esto?' : 'Asignar responsables'}</h2>
        <p>${modo === 'iniciar' ? 'Elegí al menos un operario para poner la tarea en curso.' : 'Marcá o desmarcá quién está a cargo.'}</p>
        <div class="equipo-modal-list">
          ${OPERARIOS.map(op => `
            <label class="resp-option">
              <input type="checkbox" ${seleccion.includes(op) ? 'checked' : ''} onclick="toggleEquipoSeleccion('${op}')">
              ${esc(op)}
            </label>`).join('')}
        </div>
        <div class="edit-actions" style="margin-top:12px;">
          <button class="btn-save" onclick="guardarEquipoModal()">${modo === 'iniciar' ? '▶️ Iniciar' : 'Guardar'}</button>
          <button class="btn-cancel" onclick="cerrarEquipoModal()">Cancelar</button>
        </div>
      </div>
    </div>`;
}
function renderResponsables(tabla, item) {
  const resp = item.responsables || [];
  const chips = resp.length
    ? resp.map(n => `<span class="resp-chip">${esc(n)}</span>`).join('')
    : `<span class="resp-chip sin">Sin asignar</span>`;
  return `<div class="resp-wrap">
    ${chips}
    <button class="btn-asignar" title="Asignar responsable" onclick="event.stopPropagation();abrirEquipoModal('${tabla}','${item.id}','asignar')">👷</button>
  </div>`;
}

// ── NOTAS ──
async function cargarNotas() {
  const { data } = await sb.from('notas').select('*').order('created_at',{ascending:false});
  notas = data||[]; renderizarNotas();
}

async function agregarNota() {
  if (!usuario) { toast('Elegí quién sos antes de agregar'); document.getElementById('usuarioActual').focus(); return; }
  const texto = document.getElementById('nuevaNota').value.trim();
  if (!texto) { toast('⚠️ Escribí algo primero'); return; }
  const urgente = document.getElementById('nuevaUrgente').checked;
  document.getElementById('btnAgregar').disabled = true;
  const { data, error } = await sb.from('notas').insert({texto,urgente,autor:usuario}).select().single();
  document.getElementById('btnAgregar').disabled = false;
  if (error) { toast('❌ Error guardando'); return; }
  notas.unshift(data); renderizarNotas();
  document.getElementById('nuevaNota').value = '';
  document.getElementById('nuevaUrgente').checked = false;
  toast('✓ Tarea agregada');
}

async function eliminarNota(id) {
  const { error } = await sb.from('notas').delete().eq('id',id);
  if (error) { toast('❌ Error eliminando'); return; }
  notas = notas.filter(n=>n.id!==id); renderizarNotas();
}

async function completarNota(id) {
  const nota = notas.find(n=>n.id===id);
  if (!nota) return;
  const { error } = await sb.from('historial').insert({
    texto: nota.texto, urgente: nota.urgente || false,
    autor: nota.autor, cerrado_por: usuario,
    created_at_original: nota.created_at
  });
  if (error) { toast('❌ Error al completar'); console.error(error); return; }
  await sb.from('notas').delete().eq('id',id);
  notas = notas.filter(n=>n.id!==id); renderizarNotas();
  celebrarCompletado(usuario);
}

async function guardarEdicionNota(id) {
  const textarea = document.getElementById('edit-'+id);
  if (!textarea) return;
  const nuevoTexto = textarea.value.trim();
  if (!nuevoTexto) return;
  const { error } = await sb.from('notas').update({texto:nuevoTexto}).eq('id',id);
  if (error) { toast('❌ Error guardando'); return; }
  notas = notas.map(n=>n.id===id?{...n,texto:nuevoTexto}:n);
  editandoId = null; renderizarNotas(); toast('✓ Nota actualizada');
}

function renderizarNotas() {
  const el = document.getElementById('listaTareas');
  let filtradas = notas.filter(n => {
    if (filtroModo === 'urgente' && !n.urgente) return false;
    if (filtroModo === 'en_curso' && n.estado !== 'en_curso') return false;
    if (filtroTexto) {
      const t = filtroTexto.toLowerCase();
      const enTexto = n.texto.toLowerCase().includes(t);
      const enResponsables = (n.responsables || []).some(r => r.toLowerCase().includes(t));
      if (!enTexto && !enResponsables) return false;
    }
    return true;
  });
  if (!filtradas.length) { el.innerHTML = `<div class="empty-state">${notas.length ? 'Nada coincide con el filtro' : 'Sin tareas pendientes'}</div>`; }
  else {
    const ordenadas = [...filtradas].sort((a,b) => {
      if (a.urgente !== b.urgente) return a.urgente ? -1 : 1;
      return new Date(b.created_at) - new Date(a.created_at);
    });
    el.innerHTML = ordenadas.map(n => renderCard(n)).join('');
  }
  if (tabActual === 'operarios') renderizarOperarios();
}

function aplicarFiltroNotas() {
  filtroTexto = document.getElementById('filtroTexto').value.trim();
  renderizarNotas();
}
function setFiltroModo(modo) {
  filtroModo = modo;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.toggle('active', b.dataset.modo === modo));
  renderizarNotas();
}
function aplicarFiltroCompras() {
  filtroTextoCompras = document.getElementById('filtroTextoCompras').value.trim();
  renderizarCompras();
}

function renderCard(nota) {
  const f = new Date(nota.created_at);
  const fd = f.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  const fh = f.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const ac = nota.autor==='Carlos'?'author-carlos':(nota.autor==='Alberto'?'author-alberto':'author-op');
  const enCurso = nota.estado === 'en_curso';
  const pausada = nota.estado === 'pausada';
  if (editandoId===nota.id) return `
    <div class="card" data-id="${nota.id}">
      <textarea class="edit-textarea" id="edit-${nota.id}">${esc(nota.texto)}</textarea>
      <div class="edit-actions">
        <button class="btn-save" onclick="guardarEdicionNota('${nota.id}')">Guardar</button>
        <button class="btn-cancel" onclick="cancelarEdicion()">Cancelar</button>
      </div>
      <div class="card-meta"><span class="card-author ${ac}">${esc(nota.autor)}</span><span class="card-date">${fd} ${fh}</span></div>
    </div>`;
  const badge = enCurso ? '<span class="estado-badge en-curso">🔵 EN CURSO</span>'
    : pausada ? '<span class="estado-badge pausada">⏸ PAUSADA</span>' : '';
  const urgenteBadge = nota.urgente ? '<span class="estado-badge urgente">🚨 URGENTE</span>' : '';

  let botonEstado;
  if (enCurso) {
    botonEstado = `<button class="card-btn" onclick="pausarTarea('${nota.id}')" title="Pausar">⏸</button>
      <button class="card-btn complete" onclick="completarNota('${nota.id}')" title="Terminado">✅</button>`;
  } else if (pausada) {
    botonEstado = `<button class="card-btn iniciar" onclick="event.stopPropagation();abrirEquipoModal('notas','${nota.id}','iniciar')" title="Reanudar">▶️</button>
      <button class="card-btn complete" onclick="completarNota('${nota.id}')" title="Terminado">✅</button>`;
  } else {
    botonEstado = `<button class="card-btn iniciar" onclick="event.stopPropagation();abrirEquipoModal('notas','${nota.id}','iniciar')" title="Poner en curso">▶️</button>`;
  }

  return `
    <div class="card ${enCurso ? 'en-curso' : ''} ${pausada ? 'pausada' : ''} ${nota.urgente ? 'urgente' : ''}" data-id="${nota.id}">
      <div class="card-top">
        <div class="card-text">${urgenteBadge}${esc(nota.texto)}${badge}</div>
        <div class="card-actions">
          ${botonEstado}
          <button class="card-btn" onclick="iniciarEdicion('${nota.id}')" title="Editar">✏️</button>
          <button class="card-btn delete" onclick="confirmarEliminar('${nota.id}')" title="Eliminar">🗑</button>
        </div>
      </div>
      <div class="card-meta">
        <span class="card-author ${ac}">${esc(nota.autor)}</span><span class="card-date">${fd} ${fh}</span>${renderResponsables('notas', nota)}
      </div>
      ${renderImagenes(nota.imagenes)}
    </div>`;
}

function iniciarEdicion(id) {
  editandoId=id; renderizarNotas();
  setTimeout(()=>{ const el=document.getElementById('edit-'+id); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} },50);
}
function cancelarEdicion() { editandoId=null; renderizarNotas(); }
function confirmarEliminar(id) { if(confirm('¿Eliminar esta tarea permanentemente?')) eliminarNota(id); }

// ── COMPRAS ──
async function cargarCompras() {
  const { data } = await sb.from('compras').select('*').order('created_at',{ascending:true});
  compras = data||[]; renderizarCompras();
}

async function agregarCompra() {
  if (!usuario) { toast('Elegí quién sos antes de agregar'); document.getElementById('usuarioActualCompras').focus(); return; }
  const texto = document.getElementById('nuevaCompra').value.trim();
  if (!texto) { toast('⚠️ Escribí algo primero'); return; }
  document.getElementById('btnCompra').disabled=true;
  const { data, error } = await sb.from('compras').insert({texto,autor:usuario,comprado:false}).select().single();
  document.getElementById('btnCompra').disabled=false;
  if (error) { toast('❌ Error guardando'); return; }
  compras.push(data); renderizarCompras();
  document.getElementById('nuevaCompra').value='';
  toast('✓ Ítem agregado');
}

async function toggleCompra(id) {
  const c = compras.find(x=>x.id===id);
  if (!c) return;
  const { error } = await sb.from('compras').update({comprado:!c.comprado}).eq('id',id);
  if (error) { toast('❌ Error'); return; }
  compras = compras.map(x=>x.id===id?{...x,comprado:!x.comprado}:x);
  renderizarCompras();
}

async function eliminarCompra(id) {
  const { error } = await sb.from('compras').delete().eq('id',id);
  if (error) { toast('❌ Error'); return; }
  compras = compras.filter(x=>x.id!==id); renderizarCompras();
}

function renderizarCompras() {
  const el = document.getElementById('listaCompras');
  if (!compras.length) { el.innerHTML='<div class="empty-state">Sin ítems en la lista de compras</div>'; return; }
  const filtradas = filtroTextoCompras
    ? compras.filter(c => c.texto.toLowerCase().includes(filtroTextoCompras.toLowerCase()))
    : compras;
  if (!filtradas.length) { el.innerHTML='<div class="empty-state">Nada coincide con el filtro</div>'; return; }
  const pendientes = filtradas.filter(c=>!c.comprado);
  const comprados = filtradas.filter(c=>c.comprado);
  const renderItem = c => {
    const ac = c.autor==='Carlos'?'author-carlos':(c.autor==='Alberto'?'author-alberto':'author-op');
    return `<div class="compra-card">
      <div class="compra-check ${c.comprado?'checked':''}" onclick="toggleCompra('${c.id}')">${c.comprado?'✓':''}</div>
      <div class="compra-texto ${c.comprado?'tachado':''}">${esc(c.texto)}</div>
      <div class="card-author ${ac}" style="font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:3px;">${esc(c.autor)}</div>
      ${renderResponsables('compras', c)}
      ${renderImagenes(c.imagenes)}
      <div class="compra-actions">
        <button class="card-btn delete" onclick="eliminarCompra('${c.id}')" title="Eliminar">🗑</button>
      </div>
    </div>`;
  };
  let html = '';
  if (pendientes.length) html += pendientes.map(renderItem).join('');
  if (comprados.length) html += `<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;padding:10px 4px 4px;font-weight:600;">Comprado</div>` + comprados.map(renderItem).join('');
  el.innerHTML = html;
}

// ── HISTORIAL ──
async function cargarHistorial() {
  const hace30 = new Date(); hace30.setDate(hace30.getDate()-30);
  const { data } = await sb.from('historial').select('*')
    .gte('closed_at', hace30.toISOString())
    .order('closed_at',{ascending:false});
  historial = data||[]; renderizarHistorial();
}

function renderizarHistorial() {
  const tbody = document.getElementById('tbodyHistorial');
  if (!historial.length) { tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:24px;">No hay tareas completadas en los últimos 30 días</td></tr>'; return; }
  tbody.innerHTML = historial.map(h=>{
    const fc = new Date(h.closed_at||h.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const fch = new Date(h.closed_at||h.created_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    const pill = h.urgente ? `<span class="pill" style="background:var(--alta);color:#fff;">🚨 URGENTE</span>` : `<span class="pill" style="color:var(--text-dim);">—</span>`;
    const ac = h.autor==='Carlos'?'author-carlos':(h.autor==='Alberto'?'author-alberto':'author-op');
    const cc = (h.cerrado_por||'—')==='Carlos'?'author-carlos':((h.cerrado_por||'—')==='Alberto'?'author-alberto':'author-op');
    return `<tr class="hist-row">
      <td style="border-left:3px solid var(--verde-border);">${esc(h.texto)}</td>
      <td>${pill}</td>
      <td><span class="card-author ${ac}" style="font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:3px;">${esc(h.autor)}</span></td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);">${fc} ${fch}</td>
      <td><span class="card-author ${cc}" style="font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;padding:1px 6px;border-radius:3px;">${esc(h.cerrado_por||'—')}</span></td>
    </tr>`;
  }).join('');
}

// ── EXPORT ──
function exportarPendientes() {
  if (!notas.length) { toast('⚠️ No hay tareas pendientes'); return; }
  const sorted = [...notas].sort((a,b)=>(a.urgente===b.urgente)?0:(a.urgente?-1:1));
  const rows = [['Urgente','Tarea','Autor','Fecha carga']];
  sorted.forEach(n=>{
    const f = new Date(n.created_at).toLocaleDateString('es-AR');
    rows.push([n.urgente ? 'SÍ' : 'No', n.texto, n.autor, f]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:60},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, 'Pendientes');
  XLSX.writeFile(wb, `Pendientes_${hoy()}.xlsx`);
  toast('✓ Exportado');
}

function exportarHistorial() {
  if (!historial.length) { toast('⚠️ Sin historial en los últimos 30 días'); return; }
  const rows = [['Tarea','Urgente','Creada por','Fecha completada','Cerrada por']];
  historial.forEach(h=>{
    const fc = new Date(h.closed_at||h.created_at).toLocaleDateString('es-AR');
    rows.push([h.texto, h.urgente ? 'SÍ' : 'No', h.autor, fc, h.cerrado_por||'—']);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:60},{wch:12},{wch:12},{wch:18},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws, 'Historial');
  XLSX.writeFile(wb, `Historial_${hoy()}.xlsx`);
  toast('✓ Exportado');
}

function hoy() { return new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-'); }

// ── REALTIME ──
function suscribirRealtime() {
  sb.channel('cambios-globales')
    .on('postgres_changes',{event:'*',schema:'public',table:'notas'},(p)=>{
      if(p.eventType==='INSERT'){if(!notas.find(n=>n.id===p.new.id))notas.unshift(p.new);}
      else if(p.eventType==='DELETE'){notas=notas.filter(n=>n.id!==p.old.id);}
      else if(p.eventType==='UPDATE'){notas=notas.map(n=>n.id===p.new.id?p.new:n);}
      renderizarNotas();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'compras'},(p)=>{
      if(p.eventType==='INSERT'){if(!compras.find(c=>c.id===p.new.id))compras.push(p.new);}
      else if(p.eventType==='DELETE'){compras=compras.filter(c=>c.id!==p.old.id);}
      else if(p.eventType==='UPDATE'){compras=compras.map(c=>c.id===p.new.id?p.new:c);}
      renderizarCompras();
    })
    .subscribe();
}

// UTILS
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let toastTimer;
function toast(msg){ const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500); }

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ENTER
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('nuevaNota').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();agregarNota();} });
  document.getElementById('nuevaCompra').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();agregarCompra();} });
  init();
});
</script>
